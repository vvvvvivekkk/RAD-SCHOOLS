        <div class="hidden" id="data-preloaded" data-preloaded="{&quot;topic_64411&quot;:&quot;{\&quot;post_stream\&quot;:{\&quot;posts\&quot;:[{\&quot;id\&quot;:249659,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;cgvw\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/c/dc4da7/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-08-25T19:42:21.751Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eTMIC: App Inventor Extension for the Deployment of Image Classification Models Exported from Teachable Machine\\u003cbr\\u003e\\nVersion: 1.0\\u003cbr\\u003e\\nReleased: August, 25 2022\\u003cbr\\u003e\\nTested Android 9, 12, 13, companion and compiled\\u003c/p\\u003e\\n\\u003cp\\u003eTMIC is an App Inventor extension for the deployment of ML models for image classification developed with Google Teachable Machine in educational settings.\\u003cbr\\u003e\\n\\u003ca href=\\\&quot;http://teachablemachine.withgoogle.com\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003eGoogle Teachable Machine\\u003c/a\\u003e is an intuitive visual tool that provides workflow-oriented support for the development of ML models for image classification. Aiming at the usage of models developed with Google Teachable Machine, the extension TMIC enables the deployment of the trained models as part of \\u003ca href=\\\&quot;http://appinventor.mit.edu\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003eApp Inventor\\u003c/a\\u003e, one of the most popular block-based programming environments for teaching computing in K-12.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cimg src=\\\&quot;http://computacaonaescola.paginas.ufsc.br/files/2022/07/Tmic-figure1.jpg\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;131\\\&quot; role=\\\&quot;presentation\\\&quot;\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eThe extension TMIC enables the import of ML models created with \\u003ca href=\\\&quot;http://teachablemachine.withgoogle.com/\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003eGoogle Teachable Machine\\u003c/a\\u003e and exported as Tensorflow.js uploaded on Google Cloud. It allows running the trained models on Google Cloud into the App Inventor app, and capturing images with the device’s rear-facing camera.\\u003c/p\\u003e\\n\\u003cp\\u003eThe extension is based on the \\u003ca href=\\\&quot;https://classifier.appinventor.mit.edu/\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003ePIC extension\\u003c/a\\u003e, which enables the deployment of ML models created with the \\u003ca href=\\\&quot;https://classifier.appinventor.mit.edu/\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003ePIC web application\\u003c/a\\u003e. It includes the following properties and blocks:\\u003cbr\\u003e\\n\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://community.appinventor.mit.edu/uploads/default/original/3X/2/e/2e66a2cdbb411f9ee583a665402f2e71ded46b50.jpeg\\\&quot; data-download-href=\\\&quot;https://community.appinventor.mit.edu/uploads/default/2e66a2cdbb411f9ee583a665402f2e71ded46b50\\\&quot; title=\\\&quot;TMICBlocks-overview\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://community.appinventor.mit.edu/uploads/default/optimized/3X/2/e/2e66a2cdbb411f9ee583a665402f2e71ded46b50_2_441x500.jpeg\\\&quot; alt=\\\&quot;TMICBlocks-overview\\\&quot; data-base62-sha1=\\\&quot;6CtRkqytm4U3Pic5pwXrqMkbWz6\\\&quot; width=\\\&quot;441\\\&quot; height=\\\&quot;500\\\&quot; srcset=\\\&quot;https://community.appinventor.mit.edu/uploads/default/optimized/3X/2/e/2e66a2cdbb411f9ee583a665402f2e71ded46b50_2_441x500.jpeg, https://community.appinventor.mit.edu/uploads/default/optimized/3X/2/e/2e66a2cdbb411f9ee583a665402f2e71ded46b50_2_661x750.jpeg 1.5x, https://community.appinventor.mit.edu/uploads/default/original/3X/2/e/2e66a2cdbb411f9ee583a665402f2e71ded46b50.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;EAEAE5\\\&quot;\\u003e\\u003cdi               <p>TMIC: App Inventor Extension for the Deployment of Image Classification Models Exported from Teachable Machine<br>
Version: 1.0<br>
Released: August, 25 2022<br>
Tested Android 9, 12, 13, companion and compiled</p>
<p>TMIC is an App Inventor extension for the deployment of ML models for image classification developed with Google Teachable Machine in educational settings.<br>
<a href="http://teachablemachine.withgoogle.com" rel="noopener nofollow ugc">Google Teachable Machine</a> is an intuitive visual tool that provides workflow-oriented support for the development of ML models for image classification. Aiming at the usage of models developed with Google Teachable Machine, the extension TMIC enables the deployment of the trained models as part of <a href="http://appinventor.mit.edu" rel="noopener nofollow ugc">App Inventor</a>, one of the most popular block-based programming environments for teaching computing in K-12.</p>
<p><img src="http://computacaonaescola.paginas.ufsc.br/files/2022/07/Tmic-figure1.jpg" alt="" width="690" height="131" role="presentation"></p>
<p>The extension TMIC enables the import of ML models created with <a href="http://teachablemachine.withgoogle.com/" rel="noopener nofollow ugc">Google Teachable Machine</a> and exported as Tensorflow.js uploaded on Google Cloud. It allows running the trained models on Google Cloud into the App Inventor app, and capturing images with the device’s rear-facing camera.</p>
<p>The extension is based on the <a href="https://classifier.appinventor.mit.edu/" rel="noopener nofollow ugc">PIC extension</a>, which enables the deployment of ML models created with the <a href="https://classifier.appinventor.mit.edu/" rel="noopener nofollow ugc">PIC web application</a>. It includes the following properties and blocks:<br>
<div class="lightbox-wrapper"><a class="lightbox" href="https://community.appinventor.mit.edu/uploads/default/original/3X/2/e/2e66a2cdbb411f9ee583a665402f2e71ded46b50.jpeg" data-download-href="https://community.appinventor.mit.edu/uploads/default/2e66a2cdbb411f9ee583a665402f2e71ded46b50" title="TMICBlocks-overview"><img src="https://community.appinventor.mit.edu/uploads/default/optimized/3X/2/e/2e66a2cdbb411f9ee583a665402f2e71ded46b50_2_441x500.jpeg" alt="TMICBlocks-overview" data-base62-sha1="6CtRkqytm4U3Pic5pwXrqMkbWz6" width="441" height="500" srcset="https://community.appinventor.mit.edu/uploads/default/optimized/3X/2/e/2e66a2cdbb411f9ee583a665402f2e71ded46b50_2_441x500.jpeg, https://community.appinventor.mit.edu/uploads/default/optimized/3X/2/e/2e66a2cdbb411f9ee583a665402f2e71ded46b50_2_661x750.jpeg 1.5x, https://community.appinventor.mit.edu/uploads/default/original/3X/2/e/2e66a2cdbb411f9ee583a665402f2e71ded46b50.jpeg 2x" data-dominant-color="EAEAE5"><div class="meta"><svg class="fa d-icon d-icon-far-image svg-icon" aria-hidden="true"><use href="#far-image"></use></svg><span class="filename">TMICBlocks-overview</span><span class="informations">742×841 142 KB</span><svg class="fa d-icon d-icon-discourse-expand svg-icon" aria-hidden="true"><use href="#discourse-expand"></use></svg></div></a></div></p>
<p>The extension was created with the <a href="http://ai2.appinventor.mit.edu/reference/other/extensions.html" rel="noopener nofollow ugc">App Inventor extension framework</a> and is available under the BSD 3 license and it is included with a LICENSE file.</p>
<p>Available material:</p>
<ul>
<li><a href="https://codigos.ufsc.br/gqs/tmic/-/blob/master/dist/br.ufsc.gqs.teachablemachineimageclassifier.aix" rel="noopener nofollow ugc">TMIC extension .aix</a></li>
<li><a href="https://codigos.ufsc.br/gqs/tmic" rel="noopener nofollow ugc">TMIC extension source code</a></li>
<li>Example app for the classification of recycling trash (English version <a href="https://drive.google.com/file/d/1Ub54Tzgz1pRN4I-48K4MTWbXLIyfcfzO/view?usp=sharing" rel="noopener nofollow ugc">.aia</a> and <a href="https://drive.google.com/file/d/10Uc-UMkTmGUzo-Ude0qOm8UxIoMeVTjX/view?usp=sharing" rel="noopener nofollow ugc">.apk</a>/Portuguese version <a href="https://drive.google.com/file/d/17wtUcZ6kgLwJkkAmW1sfxKu12lxAomne/view?usp=sharing" rel="noopener nofollow ugc">.aia</a> and <a href="https://drive.google.com/file/d/18svMDI3tWQyB9qtRZ7uphGzV0JyGebfu/view?usp=sharing" rel="noopener nofollow ugc">.apk</a>)</li>
<li><a href="https://cursos.computacaonaescola.ufsc.br/cursos/tutorial-implantacao-de-modelo-de-ml-com-tmic/" rel="noopener nofollow ugc">Online tutorial</a> explaining the use of the extension (in Portuguese)</li>
</ul>
<p><div class="lightbox-wrapper"><a class="lightbox" href="https://community.appinventor.mit.edu/uploads/default/original/3X/e/4/e403d50323a54e60a8fe4996024b5f34e231a9da.png" data-download-href="https://community.appinventor.mit.edu/uploads/default/e403d50323a54e60a8fe4996024b5f34e231a9da" title="blocks-appRecycling"><img src="https://community.appinventor.mit.edu/uploads/default/optimized/3X/e/4/e403d50323a54e60a8fe4996024b5f34e231a9da_2_362x500.png" alt="blocks-appRecycling" data-base62-sha1="wx74ymasKT6klawpsb5WTTEvHAe" width="362" height="500" srcset="https://community.appinventor.mit.edu/uploads/default/optimized/3X/e/4/e403d50323a54e60a8fe4996024b5f34e231a9da_2_362x500.png, https://community.appinventor.mit.edu/uploads/default/optimized/3X/e/4/e403d50323a54e60a8fe4996024b5f34e231a9da_2_543x750.png 1.5x, https://community.appinventor.mit.edu/uploads/default/original/3X/e/4/e403d50323a54e60a8fe4996024b5f34e231a9da.png 2x" data-dominant-color="716B6C"><div class="meta"><svg class="fa d-icon d-icon-far-image svg-icon" aria-hidden="true"><use href="#far-image"></use></svg><span class="filename">blocks-appRecycling</span><span class="informations">702×967 65.3 KB</span><svg class="fa d-icon d-icon-discourse-expand svg-icon" aria-hidden="true"><use href="#discourse-expand"></use></svg></div></a></div></p>
<p>The extension is being developed by the <a href="https://computacaonaescola.ufsc.br/en" rel="noopener nofollow ugc">initiative Computação na Escola</a> of the Department of Informatics and Statistics of the Federal University of Santa Catarina/Brazil as part of a research effort aiming at introducing AI education in K-12.</p>
<p>F. Pereira de Oliveira, C. Gresse von Wangenheim, J. C. R. Hauck. TMIC: App Inventor Extension for the Deployment of Image Classification Models Exported from Teachable Machine. arXiv, 2022.</p>
<p>We would love to see the apps you create with this extension! Share the apps using the hashtag <span class="hashtag-raw">#cneufsc</span></p>
