ent="https://static.vikaspedia.in/mediastorage/filestorage/20261021112839_CBSEAIcurriculum.webp"/><meta property="og:locale" content="en"/><meta name="twitter:card" content="summary_large_image"/><meta name="twitter:title" content="Curriculum Framework for Computational Thinking  and Artificial Intelligence for Classes III–VIII"/><meta name="twitter:description" content="Provides information about CBSE Curriculum Framework for Computational Thinking (CT) and Artificial Intelligence (AI) for Classes III–VIII"/><meta name="twitter:image" content="https://static.vikaspedia.in/mediastorage/filestorage/20261021112839_CBSEAIcurriculum.webp"/><meta name="twitter:site" content="@vikaspedia"/><script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://education.vikaspedia.in?lgn=en"},{"@type":"ListItem","position":2,"name":"Education","item":"https://education.vikaspedia.in/viewcontent/education?lgn=en"},{"@type":"ListItem","position":3,"name":"Artificial Intelligence","item":"https://education.vikaspedia.in/viewcontent/education/artificial-intelligence?lgn=en"},{"@type":"ListItem","position":4,"name":"Curriculum Framework for Computational Thinking  and Artificial Intelligence for Classes III–VIII","item":"https://education.vikaspedia.in/viewcontent/education/artificial-intelligence/curriculum-framework-for-computational-thinking-and-artificial-intelligence-for-classes-iii-viii?lgn=en"}]}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","mainEntityOfPage":{"@type":"WebPage","@id":"https://education.vikaspedia.in/viewcontent/education/artificial-intelligence/curriculum-framework-for-computational-thinking-and-artificial-intelligence-for-classes-iii-viii?lgn=en"},"headline":"Curriculum Framework for Computational Thinking  and Artificial Intelligence for Classes III–VIII","description":"Provides information about CBSE Curriculum Framework for Computational Thinking (CT) and Artificial Intelligence (AI) for Classes III–VIII","image":"https://static.vikaspedia.in/mediastorage/filestorage/20261021112839_CBSEAIcurriculum.webp","author":{"@type":"Person","name":"Vikaspedian"},"contributor":{"@type":"Person","name":"Vikaspedian"},"keywords":["students' and teachers' resource books for course on computational thinking and artificial intelligence","computational thinking for schools","computational thinking curriculum framework","cbse ai curriculum","ai curriculum for schools","ai curriculum framework"],"articleBody":"<p>The National Education Policy (NEP) aims to position India as a leader in emerging knowledge fields by integrating technologies like Artificial Intelligence, Machine Learning, Big Data, and Computational Thinking into school education. It promotes technology-enabled, interactive, and gamified learning using tools such as Augmented Reality (AR), Virtual Reality (VR), and virtual labs to foster creativity, problem-solving, and interdisciplinary exploration. NCF-SE 2023 carries this recommendation further for implementation.</p>\n<h3>Key Definitions</h3>\n<ul>\n<li><strong>Artificial Intelligence (AI)</strong> is a broad collection of technologies that enable machines to carry out tasks typically associated with human intelligence such as learning, comprehension, reasoning, problem-solving, and understanding natural language.</li>\n<li><strong>Computational Thinking (CT) </strong>is a structured approach to problem-solving that breaks larger problems into smaller, logical pieces, building precise, step-by-step solutions that either a person or a machine can follow.</li>\n</ul>\n<p>While Al is an important requirement, CT is a broader skill, developing a foundation for learning.</p>\n<h3>Curriculum Framework for CT and Al for Classes 3 to 8</h3>\n<p><img style=\"max-width: 100%; height: 406px; float: right;\" src=\"https://static.vikaspedia.in/mediastorage/filestorage/20261021112839_CBSEAIcurriculum.webp\" alt=\"Uploaded Image\" width=\"483\">Under the guidance of the Ministry of Education, Government of India, CBSE developed the Curriculum Framework for CT and Al for Classes 3 to 8. The curriculum seeks to integrate CT with Al and other technological advancements, without dependence on any specific platform, focusing on curricular goals, competencies, learning outcomes, and syllabi with necessary details on pedagogy, resources, assessment, and implementation guidelines.</p>\n<p>This curriculum aims to develop AI-Ready learners by focusing on CT Skills. The AI-readiness so inculcated will help develop learners' capacities for logical thinking, problem-solving, and pattern recognition, and for understanding the role and use of Al in daily life.</p>\n<h3>Curriculum Aims</h3>\n<ul>\n<li>Build strong foundations in CT, digital literacy, and responsible use of technology.</li>\n<li>Nurture innovation, critical thinking, and ethical decision-making capacities.</li>\n<li>Enable learners to develop the ability to think logically, approach and solve problems systematically, find patterns, and apply technology for solving day-to-day life problems.</li>\n<li>Understand the ethical use of technology and the relevance of AI in daily life.</li>\n<li>Build strong foundations in CT, digital literacy, and responsible technology use.</li>\n<li>Encourage students to think creatively, solve problems, and make ethical choices and equip them with the capacities and tools needed for higher education, profession and everyday life.</li>\n</ul>\n<p>Research articles present CT as the key underlying foundation for Al, showing that skills like breaking problems into parts, spotting patterns, filtering essential information, and designing step-wise procedures are the same reasoning processes that power Al and ML systems. The curriculum positions CT as a foundation needed for learning all the subjects, including AI. It also envisages integrating CT across school subjects, including beyond Mathematics, as a cross-cutting theme.</p>\n<h4>Progression across Class levels</h4>\n<ul>\n<li><strong>Classes 3-5 (Preparatory Stage) </strong>- At present, CT is part of the Mathematics curriculum in the school curriculum. The curriculum recommends embedding CT in all the subjects, such as TWAU (The World Around Us) and Mathematics, with focused learning experiences through workbooks. Time allocation: so hours annually.</li>\n<li><strong>Classes 6-8 (Middle Stage) </strong>- At this stage, CT is again incorporated into all the school subjects through worksheet- and project-based learning, along with an introduction to foundational concepts of AI (AI literacy). Time allocation: 100 hours annually.</li>\n</ul>\n<p>The teaching of CT and AI should reflect real-world challenges, focusing on hands-on experiences. To achieve this, a variety of engaging pedagogical methods, such as puzzles, structured problems, collaborative and individual projects, demonstrations, practice sessions, discussions, debates, and reflective exercises, are crucial. Students should be allowed to explore the practical challenges faced by the community, devise solutions for them, and apply the knowledge beyond the classroom. Teachers would need to provide the mentorship needed for such explorations.</p>\n<p>The <strong>assessment methods</strong> need to align with these curricular intentions and the pedagogical practices to ensure authentic assessment. For Classes 3-5, assessments will be linked to core subjects such as Mathematics and TWAU. From Class 6 onwards, evaluations will focus on project presentations, assignments, reflective journals, and assigned tasks. Teachers need to create clear and consistent rubrics to evaluate student performance, ensuring consistency and clarity in the assessment process.</p>\n<p>CT forms the basis of learning AI. So, the curriculum will begin with an introduction to CT and deepen it as we move through the stages. Al is introduced later, once the pre-requisite knowledge of CT is built for understanding AI. Implementation across classes follows this principle of a phased approach. Thus, for Classes 3-5, Mathematics and other subject teachers will deliver the CT syllabus. For Classes 6-8, the curriculum entails advanced CT, interdisciplinary projects and basic concepts of AI. This requires collaboration among teachers of various subjects.</p>\n<p><strong>Resources</strong>: For effective implementation of the curriculum, supportive materials such as teacher manuals and resource books have been provided. There will be flexibility for schools to choose the platform for executing projects and assignments, without being tied to specific software or technology. The curriculum framework recommends harnessing the potential of free and open-source tools to ensure accessibility and adaptability for all institutions.</p>\n<p><a title=\"External website that opens in new window\" href=\"https://cbseacademic.nic.in/ct-ai.html\" target=\"_blank\" rel=\"noopener\">Students' and Teachers' Resource books for course on Computational Thinking and Artificial Intelligence (CT&amp;AI) for classes 3rd to 8th</a></p>\n<p>To access the Curriculum Framework, <a title=\"External website that opens in new window\" href=\"https://cbseacademic.nic.in/web_material/CurriculumMain27/CTAI_Pri_2026-27.pdf\" target=\"_blank\" rel=\"noopener\">click here.</a></p>","publisher":{"@type":"GovernmentOrganization","name":"CDAC-Hyderabad","url":"https://www.cdac.in/","logo":{"@type":"ImageObject","url":"https://www.cdac.in/img/cdac-logo.png"}},"datePublished":"2026-10-21T05:54:13.000+00:00","dateModified":"2026-10-21T05:57:39.000+00:00","inLanguage":"en","workTranslation":[{"@type":"WebPage","inLanguage":"en","url":"https://education.vikaspedia.in/viewcontent/education/artificial-intelligence/curriculum-framework-for-computational-thinking-and-artificial-intelligence-for-classes-iii-viii?lgn=en"},{"@type":"WebPage","inLanguage":"hi","url reated_at":"2026-10-21T05:54:13.000+00:00","translatedPages":[],"created_by_name":"Vikaspedian","summery":"Provides information about CBSE Curriculum Framework for Computational Thinking (CT) and Artificial Intelligence (AI) for Classes III–VIII","title":"Curriculum Framework for Computational Thinking  and Artificial Intelligence for Classes III–VIII","created_by":123,"isAutoGenerated":false,"relatedPages":[{"lgn":"en","context_path":"/education/teachers-corner/learning-outcomes/cbse-assessment-framework-for-science-maths-and-english-classes","domain":"Education","language":"English","id":411864,"title":"CBSE Assessment Framework for Science, Maths and English classes","summery":"CBSE Assessment Framework for Science, Maths and English classes that aims to shift focus from rote learning to competency-based learning.","url":"https://education.vikaspedia.in/viewcontent/education/teachers-corner/learning-outcomes/cbse-assessment-framework-for-science-maths-and-english-classes?lgn=en"},{"lgn":"en","context_path":"/education/career-guidance/entrance-examinations/joint-mscin-data-science-and-artificial-intelligence","domain":"Education","language":"English","id":417877,"title":"Joint M.Sc.in Data Science and Artificial Intelligence","summery":"Provides information about Joint Masters Program in Data Science and Artificial Intelligence offered jointly by the Indian Institute of Technology Madras (IIT Madras) and the University of Birmingham.","url":"https://education.vikaspedia.in/viewcontent/education/career-guidance/entrance-examinations/joint-mscin-data-science-and-artificial-intelligence?lgn=en"},{"lgn":"en","context_path":"/education/artificial-intelligence/free-ai-courses-to-school-teachers","domain":"Education","language":"English","id":421647,"title":"Free AI Courses to School Teachers","summery":"Indian Institute of Technology Madras (IIT Madras) expands SWAYAM Plus Free AI Courses to School Teachers of all Classes across India.","url":"https://education.vikaspedia.in/viewcontent/education/artificial-intelligence/free-ai-courses-to-school-teachers?lgn=en"},{"lgn":"en","context_path":"/education/artificial-intelligence/skilling-for-ai-readiness","domain":"Education","language":"English","id":421905,"title":"Skilling for AI Readiness","summery":"Skilling for AI Readiness (SOAR) targets school students from class 6 to class 12 and educators to enable a future-ready India in this increasingly digital world.","url":"https://education.vikaspedia.in/viewcontent/education/artificial-intelligence/skilling-for-ai-readiness?lgn=en"},{"lgn":"en","context_path":"/education/artificial-intelligence/prompt-engineering-guide-for-government-teachers-a-practical-framework-for-cost-efficient-and-governed-ai-usage-in-rural-schools","domain":"Education","language":"English","id":423035,"title":"Prompt Engineering Guide for Government Teachers: A Practical Framework for Cost-Efficient and Governed AI Usage in Rural Schools","summery":"This article provides a framework for government school educators to safely and effectively integrate AI into their teaching workflows.","url":"https://education.vikaspedia.in/viewcontent/education/artificial-intelligence/prompt-engineering-guide-for-government-teachers-a-practical-framework-for-cost-efficient-and-governed-ai-usage-in-rural-schools?lgn=en"},{"lgn":"en","context_path":"/education/career-guidance/academic-courses/certificate-courses-and-short-term-courses/free-artificial-intelligence-(ai)-skill-training-for-students-at-nielit-lucknow under-indiaai-mission","domain":"Education","language":"English","id":423295,"title":"Free Artificial Intelligence (AI) Skill Training for Students at NIELIT Lucknow Under IndiaAI Mission","summery":"Provides information about Free Artificial Intelligence (AI) Skill Training for Students at NIELIT Lucknow Under IndiaAI Mission.","url":"https://education.vikaspedia.in/viewcontent/education/career-guidance/academic-courses/certificate-courses-and-short-term-courses/free-artificial-intelligence-(ai)-skill-training-for-students-at-nielit-lucknow under-indiaai-mission?lgn=en"},{"lgn":"en","context_path":"/education/interactive-resources/iit-madras-swayam-plus-launches-three-new-beginner-friendly-ai-courses","domain":"Education","language":"English","id":423709,"title":"IIT Madras' SWAYAM Plus Launches Three New Beginner-Friendly AI Courses","summery":"Provides information about the three new beginner-friendly AI courses (AI for Aspiring Engineers, AI for Administrators, and Prompt Engineering) launched by IIT Madras SWAYAM Plus as part of its 'AI for All' campaign.","url":"https://education.vikaspedia.in/viewcontent/education/interactive-resources/iit-madras-swayam-plus-launches-three-new-beginner-friendly-ai-courses?lgn=en"},{"lgn":"en","context_path":"/education/interactive-resources/worksheets-for-students/english-worksheets/english-revision-worksheet-class-3","domain":"Education","language":"English","id":424740,"title":"English Revision Worksheet Class 3","summery":"A comprehensive English reading and writing worksheet designed for Class 3 students, featuring diverse exercises such as reading comprehension, sentence making, vocabulary matching, and handwriting practice.","url":"https://education.vikaspedia.in/viewcontent/education/interactive-resources/worksheets-for-students/english-worksheets/english-revision-worksheet-class-3?lgn=en"},{"lgn":"en","context_path":"/education/artificial-intelligence/education-and-artificial-intelligence-transforming-learning-in-the-digital-era","domain":"Education","language":"English","id":424907,"title":"Education and Artificial Intelligence: Transforming Learning in the Digital Era","summery":"Artificial Intelligence (AI) is rapidly redefining the landscape of modern education. This article explores how AI tools and technologies enhance the learning experience for students, assist educators in personalized teaching, and bridge educational gaps across diverse communities. It highlights key applications, benefits, ethical considerations, and the balanced approach needed to integrate AI responsibly into everyday learning.","url":"https://education.vikaspedia.in/viewcontent/education/artificial-intelligence/education-and-artificial-intelligence-transforming-learning-in-the-digital-era?lgn=en"}],"content":"\u003cp\u003eThe National Education Policy (NEP) aims to position India as a leader in emerging knowledge fields by integrating technologies like Artificial Intelligence, Machine Learning, Big Data, and Computational Thinking into school education. It promotes technology-enabled, interactive, and gamified learning using tools such as Augmented Reality (AR), Virtual Reality (VR), and virtual labs to foster creativity, problem-solving, and interdisciplinary exploration. NCF-SE 2023 carries this recommendation further for implementation.\u003c/p\u003e\n\u003ch3\u003eKey Definitions\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eArtificial Intelligence (AI)\u003c/strong\u003e is a broad collection of technologies that enable machines to carry out tasks typically associated with human intelligence such as learning, comprehension, reasoning, problem-solving, and understanding natural language.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eComputational Thinking (CT) \u003c/strong\u003eis a structured approach to problem-solving that breaks larger problems into smaller, logical pieces, building precise, step-by-step solutions that either a person or a machine can follow.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eWhile Al is an important requirement, CT is a broader skill, developing a foundation for learning.\u003c/p\u003e\n\u003ch3\u003eCurriculum Framework for CT and Al for Classes 3 to 8\u003c/h3\u003e\n\u003cp\u003e\u003cimg style=\"max-width: 100%; height: 406px; float: right;\" src=\"https://static.vikaspedia.in/mediastorage/filestorage/20261021112839_CBSEAIcurriculum.webp\" alt=\"Uploaded Image\" width=\"483\"\u003eUnder the guidance of the Ministry of Education, Government of India, CBSE developed the Curriculum Framework for CT and Al for Classes 3 to 8. The curriculum seeks to integrate CT with Al and other technological advancements, without dependence on any specific platform, focusing on curricular goals, competencies, learning outcomes, and syllabi with necessary details on pedagogy, resources, assessment, and implementation guidelines.\u003c/p\u003e\n\u003cp\u003eThis curriculum aims to develop AI-Ready learners by focusing on CT Skills. The AI-readiness so inculcated will help develop learners' capacities for logical thinking, problem-solving, and pattern recognition, and for understanding the role and use of Al in daily life.\u003c/p\u003e\n\u003ch3\u003eCurriculum Aims\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eBuild strong foundations in CT, digital literacy, and responsible use of technology.\u003c/li\u003e\n\u003cli\u003eNurture innovation, critical thinking, and ethical decision-making capacities.\u003c/li\u003e\n\u003cli\u003eEnable learners to develop the ability to think logically, approach and solve problems systematically, find patterns, and apply technology for solving day-to-day life problems.\u003c/li\u003e\n\u003cli\u003eUnderstand the ethical use of technology and the relevance of AI in daily life.\u003c/li\u003e\n\u003cli\u003eBuild strong foundations in CT, digital literacy, and responsible technology use.\u003c/li\u003e\n\u003cli\u003eEncourage students to think creatively, solve problems, and make ethical choices and equip them with the capacities and tools needed for higher education, profession and everyday life.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eResearch articles present CT as the key underlying foundation for Al, showing that skills like breaking problems into parts, spotting patterns, filtering essential information, and designing step-wise procedures are the same reasoning processes that power Al and ML systems. The curriculum positions CT as a foundation needed for learning all the subjects, including AI. It also envisages integrating CT across school subjects, including beyond Mathematics, as a cross-cutting theme.\u003c/p\u003e\n\u003ch4\u003eProgression across Class levels\u003c/h4\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eClasses 3-5 (Preparatory Stage) \u003c/strong\u003e- At present, CT is part of the Mathematics curriculum in the school curriculum. The curriculum recommends embedding CT in all the subjects, such as TWAU (The World Around Us) and Mathematics, with focused learning experiences through workbooks. Time allocation: so hours annually.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eClasses 6-8 (Middle Stage) \u003c/strong\u003e- At this stage, CT is again incorporated into all the school subjects through worksheet- and project-based learning, along with an introduction to foundational concepts of AI (AI literacy). Time allocation: 100 hours annually.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe teaching of CT and AI should reflect real-world challenges, focusing on hands-on experiences. To achieve this, a variety of engaging pedagogical methods, such as puzzles, structured problems, collaborative and individual projects, demonstrations, practice sessions, discussions, debates, and reflective exercises, are crucial. Students should be allowed to explore the practical challenges faced by the community, devise solutions for them, and apply the knowledge beyond the classroom. Teachers would need to provide the mentorship needed for such explorations.\u003c/p\u003e\n\u003cp\u003eThe \u003cstrong\u003eassessment methods\u003c/strong\u003e need to align with these curricular intentions and the pedagogical practices to ensure authentic assessment. For Classes 3-5, assessments will be linked to core subjects such as Mathematics and TWAU. From Class 6 onwards, evaluations will focus on project presentations, assignments, reflective journals, and assigned tasks. Teachers need to create clear and consistent rubrics to evaluate student performance, ensuring consistency and clarity in the assessment process.\u003c/p\u003e\n\u003cp\u003eCT forms the basis of learning AI. So, the curriculum will begin with an introduction to CT and deepen it as we move through the stages. Al is introduced later, once the pre-requisite knowledge of CT is built for understanding AI. Implementation across classes follows this principle of a phased approach. Thus, for Classes 3-5, Mathematics and other subject teachers will deliver the CT syllabus. For Classes 6-8, the curriculum entails advanced CT, interdisciplinary projects and basic concepts of AI. This requires collaboration among teachers of various subjects.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eResources\u003c/strong\u003e: For effective implementation of the curriculum, supportive materials such as teacher manuals and resource books have been provided. There will be flexibility for schools to choose the platform for executing projects and assignments, without being tied to specific software or technology. The curriculum framework recommends harnessing the potential of free and open-source tools to ensure accessibility and adaptability for all institutions.\u003c/p\u003e\n\u003cp\u003e\u003ca title=\"External website that opens in new window\" href=\"https://cbseacademic.nic.in/ct-ai.html\" target=\"_blank\" rel=\"noopener\"\u003eStudents' and Teachers' Resource books for course on Computational Thinking and Artificial Intelligence (CT\u0026amp;AI) for classes 3rd to 8th\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eTo access the Curriculum Framework, \u003ca title=\"External website that opens in new window\" href=\"https://cbseacademic.nic.in/web_material/CurriculumMain27/CTAI_Pri_2026-27.pdf\" target=\"_blank\" rel=\"noopener\"\u003eclick here.\u003c/a\u003e\u003c/p\u003e","lgn":"en","depth":3,"updated_at":"2026-10-21T05:57:39.000+00:00","subHeading":"\u003col\u003e\u003cli\u003e\u003ca href='#section1' \u003eKey Definitions\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href='#section2' \u003eCurriculum Framework for CT and Al for Classes 3 to 8\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href='#section3' \u003eCurriculum Aims\u003c/a\u003e\u003col type='i'\u003e\u003cli\u003e\u003ca href='#section4' \u003eProgression across Class levels\u003c/a\u003e\u003c/li\u003e\u003c/ol\u003e\u003c/li\u003e\u003c/ol\u003e","domain":1,"context_type":"document","isInfoBotPage":false,"id":426109,"isCopy":false,"relatedKeywords":["students' and teachers' resource books for course on computational thinking and artificial intelligence","computational thinking for schools","computational thinking curriculum framework","cbse ai curriculum","ai curriculum for schools","ai curriculum framework"],"status":[{"isCurrent":false,"label":"Review in Process","value":1},{"isCurrent":true,"label":"Open","value":3},{"isCurrent":false,"label":"Deleted","value":4},{"isCurrent":false,"label":"Private","value":5},{"isCurrent":false,"label":"Published","value":6}]},"ssrPageData":null,"ssrNavMenu":[{"summary":"Provides up-to-date information about science and technology, including the latest discoveries and innovations.","children":[],"contextType":"folder","contextPath":"/education/science-and-technology","id":"420980","label":"Science and Technology"},{"summary":"This section provides a peek into various online interactive resources!","children":[],"contextType":"folder","contextPath":"/education/interactive-resources","id":"3585","label":"Digital Learning Resources"},{"summary":"Learning the Internet of Things.","children":[],"contextType":"folder","contextPath":"/education/internet-of-things","id":"420486","label":"Internet of Things"},{"summary":"Provides information about various internship opportunities offered by government colleges and institutions to help students gain practical experience and enhance their skills.","children":[],"contextType":"folder","contextPath":"/education/intern
